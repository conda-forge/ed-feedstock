context:
  version: "1.22.5"

package:
  name: ed
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/ed/ed-${{ version }}.tar.lz
  sha256: 56e107ddc2f29dad6690376c15bf9751509e1ee3b8241710e44edbe5c3a158cc
  file_name: ed-${{ version }}.tar.lz

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - lzip
    - make

tests:
  - script:
      - ed --help

about:
  license: GPL-3.0-or-later
  license_file: ed-${{ version }}/COPYING
  summary: Classic UNIX line editor
  homepage: https://www.gnu.org/software/ed

extra:
  recipe-maintainers:
    - danielnachun
